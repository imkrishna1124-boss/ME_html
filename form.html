<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><form></title>
</head>
<body>
   <fieldset>
    <legend>Biodata</legend>

    <form action="#" name="" target="" method="POST">
        <label for="name">Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your name">
    <br><br>
    <label for="pass">Password:</label> 
    <input type="password" name="pass" id="pass">
    <br><br>
     <label for="tel">Phone:</label>
    <input type="tel" name="tel" id="tel">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email" placeholder="enter your email">
    <br><br>
    <label for="dob">DOB:</label>
    <input type="date" name="dob" id="dob">
    <br><br>
    <label for="add">Address:</label>
    <textarea name="add" id="add"></textarea>
    <br><br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
    <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
    <br><br>
    <label for="hobb">Hobbies:</label>
    <input type="checkbox" name="hobb1" id="hobb1"><label for="hobb1">Cricket</label>
    <input type="checkbox" name="hobb2" id="hobb2"><label for="hobb2">Football</label>
    <br><br>
    <label for="lang">Select any one programming language</label>
    <select name="lang" id="lang">
        <option value="select">Select</option>
        <option value="c">C</option>
        <option value="c++">C++</option>
        <option value="python">Python</option>
        <option value="jawa">Jawa</option>

    </select>  
    </form>

   </fieldset>    
</body>
</html>
